name: Publish Dragon Bridge upgrade
on:
  push:
    branches: [main]
    paths:
      - upgrade_dragon.pl
      - .github/workflows/publish-dragon-upgrade.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Dragon Bridge upgrade
        run: |
          perl upgrade_dragon.pl
          cp index.html save-the-king-match3.html
          cat >> README.md <<'NOTES'

## July 25 — Dragon Bridge flame-lane showdown

- Dragon Bridge telegraphs a numbered board row before each breath.
- Every third successful turn, the dragon scorches that row and may burn a repaired plank.
- Matching Shield tiles builds guard; 3 guard blocks the next breath.
- Added deterministic Dragon Bridge smoke-test hooks.
NOTES
          rm -f upgrade_dragon.pl .github/workflows/publish-dragon-upgrade.yml
      - name: Commit playable build
        run: |
          git config user.name "Nombo Agent"
          git config user.email "cassie.brown324@gmail.com"
          git add -A
          git commit -m "Upgrade Dragon Bridge flame-lane showdown"
          git push
